name: Plugin CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

jobs:
  repository-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify required files exist
        run: |
          test -f Design2UMG.uplugin
          test -f README.md
          test -f Source/Design2UMGEditor/Private/Tests/Fixtures/FigmaComplex.json
          test -f Source/Design2UMGEditor/Private/Tests/Fixtures/FigmaRealDashboard.json

      - name: Fail on tracked local-only files that should not ship in the repo
        run: |
          if git ls-files | grep -Ei '^\.cowork-temp/|^\.claude/|^\.codex/|^\.vs/|^openspec/|^progress\.txt$|^ocr_result\.txt$|^CLAUDE\.md$|^AGENTS\.md$|^[^/]*review[^/]*\.md$|^Design2UMG图片/|^capture_editor_screenshot\.py$|^capture_umg_screenshot\.py$|^compare_coordinates\.py$|^screenshot\.ps1$|^screenshot\.py$|^show_expected_coords\.py$|^test_import\.py$|^verify_coords\.py$|^verify_design_size\.py$|^editor_screenshot\.png$'; then
            echo "Local-only files are tracked. Remove them before release."
            exit 1
          fi

      - name: Verify source public boundary
        shell: pwsh
        run: |
          ./Tools/Release/Assert-PublicRepoBoundary.ps1 -Mode SourceWorkspace

      - name: Verify text file hygiene
        shell: pwsh
        run: |
          ./Tools/Release/Test-TextFileHygiene.ps1

      - name: Run Python validation helper selftests
        run: |
          python -m pip install --upgrade pip
          python -m pip install Pillow
          python -m py_compile Tools/design2umg_auto_verify.py Tools/design2umg_auto_verify_batch.py Tools/design2umg_determinism_smoke.py Tools/design2umg_verify_lib/batch_discovery.py Tools/design2umg_verify_lib/compatibility.py Tools/design2umg_verify_lib/diagnostics.py Tools/design2umg_verify_lib/execution_shards.py Tools/design2umg_verify_lib/run_history.py Tools/design2umg_validation_helpers_selftest.py Tools/design2umg_compatibility_selftest.py Tools/design2umg_diagnostics_selftest.py Tools/design2umg_run_history_selftest.py Tools/design2umg_batch_report_contract_selftest.py Tools/design2umg_determinism_smoke_selftest.py
          python Tools/design2umg_validation_helpers_selftest.py
          python Tools/design2umg_compatibility_selftest.py
          python Tools/design2umg_diagnostics_selftest.py
          python Tools/design2umg_run_history_selftest.py
          python Tools/design2umg_batch_report_contract_selftest.py
          python Tools/design2umg_determinism_smoke_selftest.py

  build-plugin:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, windows, ue5]
    timeout-minutes: 60
    concurrency:
      group: design2umg-self-hosted-validation
      cancel-in-progress: false
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - name: Build plugin package with RunUAT
        run: |
          if (-not $env:UE_ROOT) {
            throw "UE_ROOT is not set on runner. Point it to your UnrealEngine root."
          }

          $uat = Join-Path $env:UE_ROOT "Engine\Build\BatchFiles\RunUAT.bat"
          if (-not (Test-Path $uat)) {
            throw "RunUAT not found at: $uat"
          }

          & $uat BuildPlugin `
            -Plugin="$pwd\Design2UMG.uplugin" `
            -Package="$pwd\dist\Design2UMG" `
            -Rocket `
            -StrictIncludes

      - name: Strip maintainer-only files from packaged plugin
        run: |
          $packageRoot = Join-Path $pwd "dist\Design2UMG"
          if (-not (Test-Path $packageRoot)) {
            throw "BuildPlugin package output not found: $packageRoot"
          }

          $maintainerOnlyPaths = @(
            "AGENTS.md",
            "CLAUDE.md",
            ".cowork-temp",
            ".claude",
            ".codex",
            ".vs",
            "Intermediate",
            "Saved",
            "openspec"
          )

          foreach ($relativePath in $maintainerOnlyPaths) {
            $targetPath = Join-Path $packageRoot $relativePath
            if (Test-Path $targetPath) {
              Remove-Item -LiteralPath $targetPath -Recurse -Force
            }
          }

      - name: Verify packaged plugin excludes maintainer-only files
        run: |
          $packageRoot = Join-Path $pwd "dist\Design2UMG"
          ./Tools/Release/Assert-PublicRepoBoundary.ps1 -RepoRoot $packageRoot -Mode Package

      - name: Run focused Design2UMG automation tests from packaged plugin
        run: |
          $project = $env:DESIGN2UMG_RUNTIME_PROJECT
          $editor = Join-Path $env:UE_ROOT "Engine\Binaries\Win64\UnrealEditor-Cmd.exe"
          $packageDescriptor = Join-Path $pwd "dist\Design2UMG\Design2UMG.uplugin"
          $installedDescriptor = Join-Path $env:UE_ROOT "Engine\Plugins\Marketplace\Design2UMG\Design2UMG.uplugin"
          $installedDescriptorBackup = "$installedDescriptor.ci-disabled"
          $logPath = Join-Path $env:RUNNER_TEMP "Design2UMG-Automation-$env:GITHUB_RUN_ID.log"

          if (-not $project) {
            throw "DESIGN2UMG_RUNTIME_PROJECT is not set on runner. Point it to the maintainer runtime project."
          }
          foreach ($requiredPath in @($project, $editor, $packageDescriptor)) {
            if (-not (Test-Path -LiteralPath $requiredPath)) {
              throw "Required automation path not found: $requiredPath"
            }
          }
          if (Test-Path -LiteralPath $installedDescriptorBackup) {
            if (Test-Path -LiteralPath $installedDescriptor) {
              Remove-Item -LiteralPath $installedDescriptorBackup -Force
            }
            else {
              Move-Item -LiteralPath $installedDescriptorBackup -Destination $installedDescriptor
            }
          }

          $descriptorWasMoved = $false
          try {
            if (Test-Path -LiteralPath $installedDescriptor) {
              Move-Item -LiteralPath $installedDescriptor -Destination $installedDescriptorBackup
              $descriptorWasMoved = $true
            }

            $testFilters = @(
              "Design2UMG.Generation",
              "Design2UMG.Unit.FigmaParser",
              "Design2UMG.BatchD"
            )
            foreach ($testFilter in $testFilters) {
              $filterLogPath = $logPath.Replace(".log", "-$($testFilter.Replace('.', '-')).log")
              & $editor `
                $project `
                "-PLUGIN=$packageDescriptor" `
                -unattended `
                -NullRHI `
                -NoSplash `
                -NoSound `
                -nop4 `
                "-ExecCmds=Automation RunTests $testFilter; Quit" `
                "-TestExit=Automation Test Queue Empty" `
                "-AbsLog=$filterLogPath"
              if ($LASTEXITCODE -ne 0) {
                throw "$testFilter automation exited with code $LASTEXITCODE. Log: $filterLogPath"
              }

              $logContent = Get-Content -LiteralPath $filterLogPath -Raw
              if ($logContent -notmatch '\*\*\*\* TEST COMPLETE\. EXIT CODE: 0 \*\*\*\*') {
                throw "Automation success marker not found for $testFilter. Log: $filterLogPath"
              }
              if ($logContent -match '(?i)Design2UMG.*(duplicate|same name|already exists|ignored)') {
                throw "Duplicate Design2UMG plugin warning detected. Log: $filterLogPath"
              }
            }
          }
          finally {
            if ($descriptorWasMoved -and (Test-Path -LiteralPath $installedDescriptorBackup)) {
              Move-Item -LiteralPath $installedDescriptorBackup -Destination $installedDescriptor
            }
          }

      - name: Upload packaged plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: Design2UMG-BuildPlugin-${{ github.sha }}
          path: dist/Design2UMG
          if-no-files-found: error
          retention-days: 14
