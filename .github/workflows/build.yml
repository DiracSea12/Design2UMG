name: Plugin CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

jobs:
  repository-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify required files exist
        run: |
          test -f Design2UMG.uplugin
          test -f README.md
          test -f Source/Design2UMGEditor/Private/Tests/Fixtures/FigmaComplex.json
          test -f Source/Design2UMGEditor/Private/Tests/Fixtures/FigmaRealDashboard.json

      - name: Fail on tracked local-only files that should not ship in the repo
        run: |
          if git ls-files | grep -Ei '^\.cowork-temp/|^\.claude/|^\.codex/|^\.vs/|^openspec/|^progress\.txt$|^ocr_result\.txt$|^CLAUDE\.md$|^AGENTS\.md$|^[^/]*review[^/]*\.md$|^Design2UMG图片/|^capture_editor_screenshot\.py$|^capture_umg_screenshot\.py$|^compare_coordinates\.py$|^screenshot\.ps1$|^screenshot\.py$|^show_expected_coords\.py$|^test_import\.py$|^verify_coords\.py$|^verify_design_size\.py$|^editor_screenshot\.png$'; then
            echo "Local-only files are tracked. Remove them before release."
            exit 1
          fi

      - name: Verify source public boundary
        shell: pwsh
        run: |
          ./Tools/Release/Assert-PublicRepoBoundary.ps1 -Mode SourceWorkspace

  build-plugin:
    if: github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, windows, ue5]
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - name: Build plugin package with RunUAT
        run: |
          if (-not $env:UE_ROOT) {
            throw "UE_ROOT is not set on runner. Point it to your UnrealEngine root."
          }

          $uat = Join-Path $env:UE_ROOT "Engine\Build\BatchFiles\RunUAT.bat"
          if (-not (Test-Path $uat)) {
            throw "RunUAT not found at: $uat"
          }

          & $uat BuildPlugin `
            -Plugin="$pwd\Design2UMG.uplugin" `
            -Package="$pwd\dist\Design2UMG" `
            -Rocket `
            -StrictIncludes

      - name: Strip maintainer-only files from packaged plugin
        run: |
          $packageRoot = Join-Path $pwd "dist\Design2UMG"
          if (-not (Test-Path $packageRoot)) {
            throw "BuildPlugin package output not found: $packageRoot"
          }

          $maintainerOnlyPaths = @(
            "AGENTS.md",
            "CLAUDE.md",
            ".cowork-temp",
            ".claude",
            ".codex",
            ".vs",
            "Intermediate",
            "Saved",
            "openspec"
          )

          foreach ($relativePath in $maintainerOnlyPaths) {
            $targetPath = Join-Path $packageRoot $relativePath
            if (Test-Path $targetPath) {
              Remove-Item -LiteralPath $targetPath -Recurse -Force
            }
          }

      - name: Verify packaged plugin excludes maintainer-only files
        run: |
          $packageRoot = Join-Path $pwd "dist\Design2UMG"
          ./Tools/Release/Assert-PublicRepoBoundary.ps1 -RepoRoot $packageRoot -Mode Package

      - name: Upload packaged plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: Design2UMG-BuildPlugin-${{ github.sha }}
          path: dist/Design2UMG
          if-no-files-found: error
          retention-days: 14
