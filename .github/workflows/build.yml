name: Plugin CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

jobs:
  repository-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify required files exist
        run: |
          test -f Design2UMG.uplugin
          test -f README.md
          test -f Source/Design2UMGEditor/Private/Tests/Fixtures/FigmaComplex.json
          test -f Source/Design2UMGEditor/Private/Tests/Fixtures/FigmaRealDashboard.json

      - name: Fail on tracked local-only files that should not ship in the repo
        run: |
          if git ls-files | grep -Ei '^\.cowork-temp/|^\.claude/|^\.codex/|^\.vs/|^openspec/|^progress\.txt$|^ocr_result\.txt$|^CLAUDE\.md$|^AGENTS\.md$|^[^/]*review[^/]*\.md$|^Design2UMG图片/|^capture_editor_screenshot\.py$|^capture_umg_screenshot\.py$|^compare_coordinates\.py$|^screenshot\.ps1$|^screenshot\.py$|^show_expected_coords\.py$|^test_import\.py$|^verify_coords\.py$|^verify_design_size\.py$|^editor_screenshot\.png$'; then
            echo "Local-only files are tracked. Remove them before release."
            exit 1
          fi

      - name: Verify source public boundary
        shell: pwsh
        run: |
          ./Tools/Release/Assert-PublicRepoBoundary.ps1 -Mode SourceWorkspace

      - name: Verify text file hygiene
        shell: pwsh
        run: |
          ./Tools/Release/Test-TextFileHygiene.ps1

      - name: Run Python validation helper selftests
        run: |
          python -m pip install --upgrade pip
          python -m pip install Pillow
          python Tools/run_validation_selftests.py

      - name: Test validation process isolation
        shell: pwsh
        run: ./Tools/Tests/Test-ValidationProcessIsolation.ps1

      - name: Test CI automation report contract
        shell: pwsh
        run: ./Tools/Tests/Test-CIAutomationReportContract.ps1

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Test Figma exporter
        working-directory: Tools/FigmaExporter
        run: |
          npm ci
          npm test

  build-plugin:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, windows, ue5]
    timeout-minutes: 60
    concurrency:
      group: design2umg-self-hosted-validation
      cancel-in-progress: false
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - name: Build plugin package with RunUAT
        run: |
          if (-not $env:UE_ROOT) {
            throw "UE_ROOT is not set on runner. Point it to your UnrealEngine root."
          }

          $uat = Join-Path $env:UE_ROOT "Engine\Build\BatchFiles\RunUAT.bat"
          if (-not (Test-Path $uat)) {
            throw "RunUAT not found at: $uat"
          }

          & $uat BuildPlugin `
            -Plugin="$pwd\Design2UMG.uplugin" `
            -Package="$pwd\dist\Design2UMG" `
            -Rocket `
            -StrictIncludes

      - name: Strip maintainer-only files from packaged plugin
        run: |
          $packageRoot = Join-Path $pwd "dist\Design2UMG"
          if (-not (Test-Path $packageRoot)) {
            throw "BuildPlugin package output not found: $packageRoot"
          }

          $maintainerOnlyPaths = @(
            "AGENTS.md",
            "CLAUDE.md",
            ".cowork-temp",
            ".claude",
            ".codex",
            ".vs",
            "Intermediate",
            "Saved",
            "openspec",
            "PenDesigns",
            "FigmaExports",
            "CODE_QUALITY_OPTIMIZATION_PLAN.md"
          )

          foreach ($relativePath in $maintainerOnlyPaths) {
            $targetPath = Join-Path $packageRoot $relativePath
            if (Test-Path $targetPath) {
              Remove-Item -LiteralPath $targetPath -Recurse -Force
            }
          }

      - name: Verify packaged plugin excludes maintainer-only files
        run: |
          $packageRoot = Join-Path $pwd "dist\Design2UMG"
          ./Tools/Release/Assert-PublicRepoBoundary.ps1 -RepoRoot $packageRoot -Mode Package

      - name: Run focused Design2UMG automation tests
        # The self-hosted runner validates the engine-installed plugin copy at
        # Engine/Plugins/Marketplace/Design2UMG (same commit as this checkout).
        # The packaged plugin is exercised by the UAT BuildPlugin -StrictIncludes
        # compile above plus the package boundary assertion.
        run: |
          $project = $env:DESIGN2UMG_RUNTIME_PROJECT
          $editor = Join-Path $env:UE_ROOT "Engine\Binaries\Win64\UnrealEditor-Cmd.exe"
          $artifactRoot = Join-Path $env:RUNNER_TEMP "Design2UMG-Automation-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"

          if (-not $project) {
            throw "DESIGN2UMG_RUNTIME_PROJECT is not set on runner. Point it to the maintainer runtime project."
          }
          foreach ($requiredPath in @($project, $editor)) {
            if (-not (Test-Path -LiteralPath $requiredPath)) {
              throw "Required automation path not found: $requiredPath"
            }
          }

          New-Item -ItemType Directory -Path $artifactRoot -Force | Out-Null
          $testRuns = @(
            [pscustomobject]@{ Filter = "Design2UMG.Generation"; Mode = "RenderOffscreen" },
            [pscustomobject]@{ Filter = "Design2UMG.Unit.FigmaParser"; Mode = "RenderOffscreen" },
            [pscustomobject]@{ Filter = "Design2UMG.Http"; Mode = "RenderOffscreen" },
            [pscustomobject]@{ Filter = "Design2UMG.Import.Planning"; Mode = "RenderOffscreen" },
            [pscustomobject]@{ Filter = "Design2UMG.Pencil.RetryTickerLifecycle"; Mode = "RenderOffscreen" },
            [pscustomobject]@{ Filter = "Design2UMG.Notifications"; Mode = "RenderOffscreen" },
            [pscustomobject]@{ Filter = "Design2UMG.LayoutData.Layout.WrapGapUsesInnerSlotPaddingOnly"; Mode = "RenderOffscreen" },
            [pscustomobject]@{ Filter = "Design2UMG.RemoteImages.ReceiveBudget"; Mode = "RenderOffscreen" },
            [pscustomobject]@{ Filter = "Design2UMG.Resources.Failure"; Mode = "RenderOffscreen" },
            [pscustomobject]@{ Filter = "Design2UMG.PreviewContext"; Mode = "RenderOffscreen" },
            [pscustomobject]@{ Filter = "Design2UMG.Unit.UMGJsonParser"; Mode = "RenderOffscreen" },
            [pscustomobject]@{ Filter = "Design2UMG.Unit.ParserBudget"; Mode = "RenderOffscreen" },
            [pscustomobject]@{ Filter = "Design2UMG.PreviewWindow"; Mode = "RenderOffscreen" },
            [pscustomobject]@{ Filter = "Design2UMG.Resources.GeneratedTextureBudget"; Mode = "RenderOffscreen" },
            [pscustomobject]@{ Filter = "Design2UMG.Preview.ResourceLifetime"; Mode = "RenderOffscreen" }
          )
          $validationFailures = [System.Collections.Generic.List[string]]::new()
          foreach ($testRun in $testRuns) {
            $safeName = $testRun.Filter -replace '[^A-Za-z0-9._-]', '-'
            $runRoot = Join-Path $artifactRoot $safeName
            $reportRoot = Join-Path $runRoot "report"
            $filterLogPath = Join-Path $runRoot "automation.log"
            $summaryPath = Join-Path $runRoot "summary.json"
            New-Item -ItemType Directory -Path $reportRoot -Force | Out-Null

            # Single argument line with explicit quoting; PowerShell native
            # argument arrays mangle ExecCmds when passed through &.
            $argumentLine = (@(
              ('"{0}"' -f $project),
              '-NoSplash',
              '-NoSound',
              '-nop4',
              '-ini:Engine:[/Script/Engine.AutomationTestSettings]:DefaultInteractiveFramerateWaitTime=5',
              ('-ReportExportPath="{0}"' -f $reportRoot),
              ('"-ExecCmds=Automation RunTests {0}; Quit"' -f $testRun.Filter),
              '"-TestExit=Automation Test Queue Empty"',
              ('"-AbsLog={0}"' -f $filterLogPath)
            ) -join ' ')
            if ($testRun.Mode -eq "NullRHI") {
              $argumentLine += ' -NullRHI'
            }
            else {
              $argumentLine += ' -RenderOffscreen'
            }

            $process = Start-Process -FilePath $editor -ArgumentList $argumentLine -PassThru
            Wait-Process -Id $process.Id
            $process.Refresh()
            $processExitCode = $process.ExitCode
            [System.IO.File]::WriteAllText(
              (Join-Path $runRoot "exit-code.txt"),
              "$processExitCode`n",
              [System.Text.UTF8Encoding]::new($false))
            [System.IO.File]::WriteAllText(
              (Join-Path $runRoot "invocation.json"),
              ([ordered]@{
                test_filter = $testRun.Filter
                render_mode = $testRun.Mode
                argument_line = $argumentLine
              } | ConvertTo-Json -Depth 4),
              [System.Text.UTF8Encoding]::new($false))

            try {
              ./Tools/CI/Assert-Design2UMGAutomationReport.ps1 `
                -TestFilter $testRun.Filter `
                -ReportPath (Join-Path $reportRoot "index.json") `
                -LogPath $filterLogPath `
                -ProcessExitCode $processExitCode `
                -SummaryPath $summaryPath `
                -RenderMode $testRun.Mode
            }
            catch {
              $validationFailures.Add("$($testRun.Filter): $($_.Exception.Message)")
            }
          }
          if ($validationFailures.Count -gt 0) {
            throw ($validationFailures -join [Environment]::NewLine)
          }

      - name: Upload focused automation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Design2UMG-Automation-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/Design2UMG-Automation-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 14

      - name: Upload packaged plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: Design2UMG-BuildPlugin-${{ github.sha }}
          path: dist/Design2UMG
          if-no-files-found: error
          retention-days: 14
