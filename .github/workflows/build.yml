name: Plugin CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Verify required files exist
        run: |
          test -f Design2UMG.uplugin
          test -f README.md
          test -f Source/Design2UMGEditor/Private/Tests/Fixtures/FigmaComplex.json
          test -f Source/Design2UMGEditor/Private/Tests/Fixtures/FigmaRealDashboard.json

      - name: Verify source public boundary
        shell: pwsh
        run: |
          ./Tools/Release/Assert-PublicRepoBoundary.ps1 -Mode SourceWorkspace

      - name: Verify text file hygiene
        shell: pwsh
        run: |
          ./Tools/Release/Test-TextFileHygiene.ps1

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: Tools/requirements-validation.txt

      - name: Run Python validation helper selftests
        run: |
          python -m pip install -r Tools/requirements-validation.txt
          python Tools/run_validation_selftests.py

      - name: Test release package and candidate identity contracts
        run: |
          python Tools/Tests/Test-ReleaseContracts.py
          python Tools/Tests/Test-EnginePluginSelection.py
          python Tools/Tests/Test-EngineEvidenceIdentity.py
          python Tools/Tests/Test-EditorProcessEvidence.py
          python Tools/Tests/Test-RenderEvidenceIdentity.py

      - name: Test validation process isolation
        shell: pwsh
        run: ./Tools/Tests/Test-ValidationProcessIsolation.ps1

      - name: Test CI automation report contract
        shell: pwsh
        run: ./Tools/Tests/Test-CIAutomationReportContract.ps1

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: Tools/FigmaExporter/package-lock.json

      - name: Test Figma exporter
        working-directory: Tools/FigmaExporter
        run: |
          npm ci
          npm test

  build-plugin:
    needs: repository-hygiene
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, windows, ue5]
    timeout-minutes: 60
    concurrency:
      group: design2umg-self-hosted-validation
      cancel-in-progress: false
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Verify candidate identity and strictly rebuild installed editor plugin
        run: |
          foreach ($name in @('UE_ROOT', 'DESIGN2UMG_RUNTIME_PROJECT', 'DESIGN2UMG_EDITOR_TARGET')) {
            if (-not [Environment]::GetEnvironmentVariable($name)) {
              throw "Required runner variable missing: $name"
            }
          }
          ./Tools/Release/Assert-CleanWorkspace.ps1
          if ($LASTEXITCODE -ne 0) { throw "Candidate workspace is not clean: $LASTEXITCODE" }
          $projectRoot = Split-Path -Parent $env:DESIGN2UMG_RUNTIME_PROJECT
          $targetFile = Join-Path $projectRoot "Source/$($env:DESIGN2UMG_EDITOR_TARGET).Target.cs"
          $targetTemplate = [IO.File]::ReadAllText((Join-Path $pwd 'Tools/CI/Design2UMGVerificationEditor.Target.cs'))
          $expectedTarget = $targetTemplate.Replace('Design2UMGVerificationEditorTarget', "$($env:DESIGN2UMG_EDITOR_TARGET)Target")
          if ([IO.File]::ReadAllText($targetFile).Replace("`r`n", "`n").Trim() -ne $expectedTarget.Replace("`r`n", "`n").Trim()) {
            throw 'Configure the isolated CI target from Tools/CI/Design2UMGVerificationEditor.Target.cs before building.'
          }
          $installed = ./Tools/CI/Assert-CandidatePlugin.ps1 -SourceRoot $pwd `
            -EngineRoot $env:UE_ROOT -ProjectFile $env:DESIGN2UMG_RUNTIME_PROJECT -PassThru
          foreach ($directory in @('Binaries', 'Intermediate')) {
            $output = [IO.Path]::GetFullPath((Join-Path $installed $directory))
            $pluginPrefix = [IO.Path]::GetFullPath($installed).TrimEnd([IO.Path]::DirectorySeparatorChar) + [IO.Path]::DirectorySeparatorChar
            if (-not $output.StartsWith($pluginPrefix, [StringComparison]::OrdinalIgnoreCase)) {
              throw "Build output is outside the installed plugin: $output"
            }
            if (Test-Path -LiteralPath $output) { Remove-Item -LiteralPath $output -Recurse -Force }
          }
          $build = Join-Path $env:UE_ROOT 'Engine/Build/BatchFiles/Build.bat'
          & $build $env:DESIGN2UMG_EDITOR_TARGET Win64 Development `
            "-Project=$env:DESIGN2UMG_RUNTIME_PROJECT" `
            -Module=Design2UMGCore -Module=Design2UMGEditor `
            -UsePrecompiled -NoEngineChanges -NoPCH -NoSharedPCH `
            -WaitMutex -NoHotReloadFromIDE
          if ($LASTEXITCODE -ne 0) { throw "Editor build failed: $LASTEXITCODE" }
          foreach ($module in @('Core', 'Editor')) {
            $binary = Join-Path $installed "Binaries/Win64/UnrealEditor-Design2UMG$module.dll"
            if (-not (Test-Path -LiteralPath $binary -PathType Leaf)) {
              throw "Candidate module was not rebuilt: $binary"
            }
          }
          $projectRoot = Split-Path -Parent $env:DESIGN2UMG_RUNTIME_PROJECT
          $metadata = @(Get-ChildItem (Join-Path $projectRoot 'Intermediate/Build/Win64') -Filter TargetMetadata.json -Recurse |
            Where-Object { $_.Directory.Name -eq 'Development' -and $_.Directory.Parent.Name -eq $env:DESIGN2UMG_EDITOR_TARGET })
          if ($metadata.Count -ne 1) { throw 'Expected one target metadata plan from the editor build.' }
          $writerSource = Join-Path $env:UE_ROOT 'Engine/Source/Programs/UnrealBuildTool/Modes/WriteMetadataMode.cs'
          $writerVersion = [regex]::Match([IO.File]::ReadAllText($writerSource), 'CurrentVersionNumber\s*=\s*(\d+)\s*;')
          if (-not $writerVersion.Success) { throw 'UBT metadata writer version was not found.' }
          & $build -Mode=WriteMetadata "-Input=$($metadata[0].FullName)" "-Version=$($writerVersion.Groups[1].Value)"
          if ($LASTEXITCODE -ne 0) { throw "Target metadata generation failed: $LASTEXITCODE" }
          $manifest = Get-Content (Join-Path $installed 'Binaries/Win64/UnrealEditor.modules') -Raw | ConvertFrom-Json
          $engineManifest = Get-Content (Join-Path $env:UE_ROOT 'Engine/Binaries/Win64/UnrealEditor.modules') -Raw | ConvertFrom-Json
          if ($manifest.BuildId -ne $engineManifest.BuildId) {
            throw 'Generated candidate module manifest does not match the engine build.'
          }

      - name: Build plugin package with RunUAT
        run: |
          if (-not $env:UE_ROOT) {
            throw "UE_ROOT is not set on runner. Point it to your UnrealEngine root."
          }

          $uat = Join-Path $env:UE_ROOT "Engine\Build\BatchFiles\RunUAT.bat"
          if (-not (Test-Path $uat)) {
            throw "RunUAT not found at: $uat"
          }

          $packageRoot = Join-Path $env:RUNNER_TEMP "Design2UMG-Package-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT/Design2UMG"
          # BuildPlugin launches UBT separately from the AutomationTool mutex.
          $env:UBT_EXTRA_ARGS = "$env:UBT_EXTRA_ARGS -WaitMutex".Trim()
          & $uat BuildPlugin `
            -Plugin="$pwd\Design2UMG.uplugin" `
            -Package="$packageRoot" `
            -Rocket `
            -TargetPlatforms=Win64 `
            -WaitForUATMutex
          if ($LASTEXITCODE -ne 0) { throw "BuildPlugin failed: $LASTEXITCODE" }

      - name: Strip maintainer-only files from packaged plugin
        run: |
          $packageRoot = Join-Path $env:RUNNER_TEMP "Design2UMG-Package-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT/Design2UMG"
          if (-not (Test-Path $packageRoot)) {
            throw "BuildPlugin package output not found: $packageRoot"
          }

          $maintainerOnlyPaths = @(
            "AGENTS.md",
            "CLAUDE.md",
            ".cowork-temp",
            ".claude",
            ".codex",
            ".vs",
            "Saved",
            "openspec",
            "PenDesigns",
            "FigmaExports",
            "CODE_QUALITY_OPTIMIZATION_PLAN.md"
          )

          foreach ($relativePath in $maintainerOnlyPaths) {
            $boundary = [IO.Path]::GetFullPath($packageRoot).TrimEnd('\', '/') + [IO.Path]::DirectorySeparatorChar
            $targetPath = [IO.Path]::GetFullPath((Join-Path $packageRoot $relativePath))
            if (-not $targetPath.StartsWith($boundary, [StringComparison]::OrdinalIgnoreCase)) {
              throw "Cleanup path is outside package root: $targetPath"
            }
            if (Test-Path $targetPath) {
              Remove-Item -LiteralPath $targetPath -Recurse -Force
            }
          }

      - name: Verify packaged plugin excludes maintainer-only files
        run: |
          $packageRoot = Join-Path $env:RUNNER_TEMP "Design2UMG-Package-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT/Design2UMG"
          ./Tools/Release/Assert-PublicRepoBoundary.ps1 -RepoRoot $packageRoot -Mode Package

      - name: Run focused Design2UMG automation tests
        id: automation
        # The self-hosted runner validates the installed plugin copy at
        # the unique installed location, after source comparison and editor rebuild.
        # Strict header checks run in the plugin-only rebuild with precompiled
        # engine modules. UAT then packages with the engine's normal build settings.
        run: |
          ./Tools/CI/Assert-CandidatePlugin.ps1 -SourceRoot $pwd `
            -EngineRoot $env:UE_ROOT -ProjectFile $env:DESIGN2UMG_RUNTIME_PROJECT
          $project = $env:DESIGN2UMG_RUNTIME_PROJECT
          $editor = Join-Path $env:UE_ROOT "Engine\Binaries\Win64\UnrealEditor-Cmd.exe"
          $artifactRoot = Join-Path $env:RUNNER_TEMP "Design2UMG-Automation-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          $automationUserDir = Join-Path $artifactRoot ("UserState-" + [Guid]::NewGuid().ToString("N"))

          if (-not $project) {
            throw "DESIGN2UMG_RUNTIME_PROJECT is not set on runner. Point it to the maintainer runtime project."
          }
          foreach ($requiredPath in @($project, $editor)) {
            if (-not (Test-Path -LiteralPath $requiredPath)) {
              throw "Required automation path not found: $requiredPath"
            }
          }

          New-Item -ItemType Directory -Path $artifactRoot -Force | Out-Null
          $testRuns = @(
            [pscustomobject]@{ Filter = "Design2UMG.Generation"; Mode = "RenderOffscreen" },
            [pscustomobject]@{ Filter = "Design2UMG.Text.FontResolverProjectDirectoryLookup"; Mode = "NullRHI" },
            [pscustomobject]@{ Filter = "Design2UMG.Automation.StructureSnapshot"; Mode = "NullRHI" },
            [pscustomobject]@{ Filter = "Design2UMG.Unit.FigmaParser"; Mode = "RenderOffscreen" },
            [pscustomobject]@{ Filter = "Design2UMG.Unit.PenParser.Imported"; Mode = "RenderOffscreen" },
            [pscustomobject]@{ Filter = "Design2UMG.Http.Figma"; Mode = "RenderOffscreen" },
            [pscustomobject]@{ Filter = "Design2UMG.MCP.Stdio"; Mode = "RenderOffscreen" },
            [pscustomobject]@{ Filter = "Design2UMG.Fonts.LocalSource"; Mode = "RenderOffscreen" },
            [pscustomobject]@{ Filter = "Design2UMG.Fonts.Persistence.Save"; Mode = "RenderOffscreen" },
            [pscustomobject]@{ Filter = "Design2UMG.Fonts.Persistence.Reload"; Mode = "RenderOffscreen" },
            [pscustomobject]@{ Filter = "Design2UMG.Fonts.Persistence.RejectedReplacement"; Mode = "RenderOffscreen" },
            [pscustomobject]@{ Filter = "Design2UMG.Fonts.Persistence.RetryReplacement"; Mode = "RenderOffscreen" },
            # Intentional second Reload: proves the retried replacement survives a fresh process.
            [pscustomobject]@{ Filter = "Design2UMG.Fonts.Persistence.Reload"; Mode = "RenderOffscreen" },
            [pscustomobject]@{ Filter = "Design2UMG.Import.Planning"; Mode = "RenderOffscreen" },
            [pscustomobject]@{ Filter = "Design2UMG.Pencil.ConnectionLifecycle"; Mode = "RenderOffscreen" },
            [pscustomobject]@{ Filter = "Design2UMG.Pencil.ReadDocumentPayload"; Mode = "RenderOffscreen" },
            [pscustomobject]@{ Filter = "Design2UMG.Notifications"; Mode = "RenderOffscreen" },
            [pscustomobject]@{ Filter = "Design2UMG.LayoutData.Layout.WrapGapUsesInnerSlotPaddingOnly"; Mode = "RenderOffscreen" },
            [pscustomobject]@{ Filter = "Design2UMG.RemoteImages.ReceiveBudget"; Mode = "RenderOffscreen" },
            [pscustomobject]@{ Filter = "Design2UMG.Resources.ImageResultFlow"; Mode = "RenderOffscreen" },
            [pscustomobject]@{ Filter = "Design2UMG.Resources.Failure"; Mode = "RenderOffscreen" },
            [pscustomobject]@{ Filter = "Design2UMG.PreviewContext"; Mode = "RenderOffscreen" },
            [pscustomobject]@{ Filter = "Design2UMG.Unit.UMGJsonParser"; Mode = "RenderOffscreen" },
            [pscustomobject]@{ Filter = "Design2UMG.Unit.ParserBudget"; Mode = "RenderOffscreen" },
            [pscustomobject]@{ Filter = "Design2UMG.PreviewWindow"; Mode = "RenderOffscreen" },
            [pscustomobject]@{ Filter = "Design2UMG.Resources.GeneratedTextureBudget"; Mode = "RenderOffscreen" },
            [pscustomobject]@{ Filter = "Design2UMG.Resources.GeneratedTexture.AssetNameBudget"; Mode = "RenderOffscreen" },
            [pscustomobject]@{ Filter = "Design2UMG.ComponentBlueprints.SameSourceReimport"; Mode = "RenderOffscreen" },
            [pscustomobject]@{ Filter = "Design2UMG.ComponentReimportPersistence.Save"; Mode = "RenderOffscreen" },
            [pscustomobject]@{ Filter = "Design2UMG.ComponentReimportPersistence.Reimport"; Mode = "RenderOffscreen" },
            [pscustomobject]@{ Filter = "Design2UMG.SafeReimport.Resources.SameSourceEffects"; Mode = "RenderOffscreen" },
            [pscustomobject]@{ Filter = "Design2UMG.Preview.ResourceLifetime"; Mode = "RenderOffscreen" }
          )
          $validationFailures = [System.Collections.Generic.List[string]]::new()
          $runIndex = 0
          foreach ($testRun in $testRuns) {
            $runIndex++
            $safeName = '{0:D2}-{1}' -f $runIndex, ($testRun.Filter -replace '[^A-Za-z0-9._-]', '-')
            $runRoot = Join-Path $artifactRoot $safeName
            $reportRoot = Join-Path $runRoot "report"
            $filterLogPath = Join-Path $runRoot "automation.log"
            $summaryPath = Join-Path $runRoot "summary.json"
            New-Item -ItemType Directory -Path $reportRoot -Force | Out-Null

            # Single argument line with explicit quoting; PowerShell native
            # argument arrays mangle ExecCmds when passed through &.
            $argumentLine = (@(
              ('"{0}"' -f $project),
              '/Engine/Maps/Templates/VR-Basic',
              ('"-UserDir={0}"' -f $automationUserDir),
              '-NoSplash',
              '-Unattended',
              '-NoSound',
              '-nop4',
              '-ini:Engine:[/Script/Engine.AutomationTestSettings]:DefaultInteractiveFramerateWaitTime=5',
              ('-ReportExportPath="{0}"' -f $reportRoot),
              ('"-ExecCmds=Automation RunTests {0}; Quit"' -f $testRun.Filter),
              '"-TestExit=Automation Test Queue Empty"',
              ('"-AbsLog={0}"' -f $filterLogPath)
            ) -join ' ')
            if ($testRun.Mode -eq "NullRHI") {
              $argumentLine += ' -NullRHI'
            }
            else {
              $argumentLine += ' -RenderOffscreen'
            }

            $process = Start-Process -FilePath $editor -ArgumentList $argumentLine -PassThru -WindowStyle Hidden
            Wait-Process -Id $process.Id
            $process.Refresh()
            $processExitCode = $process.ExitCode
            [System.IO.File]::WriteAllText(
              (Join-Path $runRoot "exit-code.txt"),
              "$processExitCode`n",
              [System.Text.UTF8Encoding]::new($false))
            [System.IO.File]::WriteAllText(
              (Join-Path $runRoot "invocation.json"),
              ([ordered]@{
                test_filter = $testRun.Filter
                render_mode = $testRun.Mode
                argument_line = $argumentLine
              } | ConvertTo-Json -Depth 4),
              [System.Text.UTF8Encoding]::new($false))

            try {
              ./Tools/CI/Assert-Design2UMGAutomationReport.ps1 `
                -TestFilter $testRun.Filter `
                -ReportPath (Join-Path $reportRoot "index.json") `
                -LogPath $filterLogPath `
                -ProcessExitCode $processExitCode `
                -SummaryPath $summaryPath `
                -RenderMode $testRun.Mode
            }
            catch {
              $validationFailures.Add("$($testRun.Filter): $($_.Exception.Message)")
            }
          }
          if ($validationFailures.Count -gt 0) {
            throw ($validationFailures -join [Environment]::NewLine)
          }

      - name: Upload focused automation evidence
        # Upload whenever automation ran, pass or fail; skip when an earlier step stopped the job.
        if: ${{ !cancelled() && steps.automation.outcome != 'skipped' }}
        uses: actions/upload-artifact@v7
        with:
          name: Design2UMG-Automation-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/Design2UMG-Automation-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 14

      - name: Prepare versioned release candidate and checksum
        run: |
          $root = Join-Path $env:RUNNER_TEMP "Design2UMG-Package-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          $plugin = Get-Content (Join-Path $root 'Design2UMG/Design2UMG.uplugin') -Raw | ConvertFrom-Json
          $engine = Get-Content (Join-Path $env:UE_ROOT 'Engine/Build/Build.version') -Raw | ConvertFrom-Json
          if ($plugin.VersionName -notmatch '^\d+\.\d+\.\d+(?:-[A-Za-z0-9.-]+)?$') { throw 'Unexpected plugin version' }
          $engineVersion = "$($engine.MajorVersion).$($engine.MinorVersion).$($engine.PatchVersion)"
          $name = "Design2UMG-$($plugin.VersionName)-UE$engineVersion-Win64.zip"
          $archive = Join-Path $root $name
          Compress-Archive -LiteralPath (Join-Path $root 'Design2UMG') -DestinationPath $archive
          $hash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          $utf8 = [Text.UTF8Encoding]::new($false)
          [IO.File]::WriteAllText((Join-Path $root 'SHA256SUMS.txt'), "$hash  $name`n", $utf8)
          $evidence = [ordered]@{
            commit = $env:GITHUB_SHA
            workflow_run = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
            plugin_version = $plugin.VersionName
            engine_version = $engineVersion
            platform = 'Win64'
            archive = $name
            sha256 = $hash
            packaged_plugin_compile = 'passed'
            focused_automation = 'passed on source-matched, rebuilt installed plugin'
            packaged_game_runtime = 'not executed by this workflow'
            full_visual_regression = 'separate maintainer evidence required'
          }
          [IO.File]::WriteAllText((Join-Path $root 'candidate.json'), ($evidence | ConvertTo-Json), $utf8)

      - name: Upload packaged plugin artifact
        uses: actions/upload-artifact@v7
        with:
          name: Design2UMG-BuildPlugin-${{ github.sha }}
          path: |
            ${{ runner.temp }}/Design2UMG-Package-${{ github.run_id }}-${{ github.run_attempt }}/*.zip
            ${{ runner.temp }}/Design2UMG-Package-${{ github.run_id }}-${{ github.run_attempt }}/candidate.json
            ${{ runner.temp }}/Design2UMG-Package-${{ github.run_id }}-${{ github.run_attempt }}/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
